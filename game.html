<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$KIBBLE - Köpeği Besle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090613; /* Ana sayfadaki derin koyu mor arka plan */
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      padding: 20px;
    }

    /* Üst Rozet & Geri Dönüş Linki */
    .top-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 8px 18px;
      border-radius: 9999px;
      color: #C084FC;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      margin-bottom: 24px;
      transition: all 0.2s ease;
    }
    .top-badge:hover {
      background: rgba(147, 51, 234, 0.3);
      color: #FFFFFF;
    }

    /* Ana Başlık */
    .title-gradient {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 20%, #E879F9 60%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    /* Ana Kart Tasarımı */
    .game-card {
      width: 100%;
      max-width: 380px;
      background: rgba(22, 16, 43, 0.7);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(147, 51, 234, 0.15);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    /* Toplam Skor Alanı */
    .score-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #A855F7;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .score-val {
      font-size: 3.2rem;
      font-weight: 900;
      color: #38BDF8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      line-height: 1;
    }

    /* Maskot Çerçevesi */
    .mascot-box {
      width: 150px;
      height: 150px;
      margin: 18px auto;
      position: relative;
    }
    .mascot-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #C084FC;
      box-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    .mascot-box img.active {
      transform: scale(1.08);
      filter: brightness(1.2);
    }

    /* Modern Geniş Tıklama Butonu */
    .bowl-btn {
      background: linear-gradient(135deg, #9333EA 0%, #4F46E5 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 280px;
      padding: 15px 20px;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(147, 51, 234, 0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
      outline: none;
      margin: 8px auto 22px auto;
      letter-spacing: 0.5px;
    }
    .bowl-btn:hover {
      filter: brightness(1.1);
    }
    .bowl-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
    }

    /* Yatay İlerleme Çubuğu */
    .progress-box {
      width: 100%;
      text-align: left;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #E2E8F0;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .progress-track {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #A855F7, #38BDF8);
      border-radius: 9999px;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
    .progress-sub {
      text-align: center;
      font-size: 0.8rem;
      color: #94A3B8;
      margin-top: 10px;
    }

    /* Dökülen Tanecik Animasyonu */
    .particle {
      position: fixed;
      font-size: 1.6rem;
      pointer-events: none;
      animation: fall 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      z-index: 9999;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(180px) scale(1.1) rotate(60deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Ana Sayfaya Dön Rozeti -->
  <a href="index.html" class="top-badge">← Ana Sayfaya Dön</a>

  <div class="title-gradient">KÖPEĞİ BESLE</div>

  <div class="game-card">
    <div class="score-title">Toplam Doldurulan Mama</div>
    <div class="score-val" id="total-val">0</div>

    <div class="mascot-box">
      <img src="maskot.jpg" alt="$KIBBLE Pup" id="mascot-pic" />
    </div>

    <!-- Yeni Modern Aksiyon Butonu -->
    <button class="bowl-btn" id="feed-action">
      <span>🥣</span> KASEYİ DOLDUR (+1)
    </button>

    <div class="progress-box">
      <div class="progress-header">
        <span>Barınak Çuval Hedefi</span>
        <span id="target-pct">%0</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="bar-fill"></div>
      </div>
      <div class="progress-sub" id="rem-text">Yeni barınak çuvalına son: 1,000 mama 🐾</div>
    </div>
  </div>

  <script>
    const TARGET = 1000;
    let score = parseInt(localStorage.getItem('kibbleTotalScore')) || 0;

    const totalEl = document.getElementById('total-val');
    const barFill = document.getElementById('bar-fill');
    const targetPct = document.getElementById('target-pct');
    const remText = document.getElementById('rem-text');
    const feedBtn = document.getElementById('feed-action');
    const mascot = document.getElementById('mascot-pic');

    function render() {
      totalEl.innerText = score.toLocaleString();
      const current = score % TARGET;
      const pct = Math.floor((current / TARGET) * 100);
      const left = TARGET - current;

      barFill.style.width = `${pct}%`;
      targetPct.innerText = `%${pct}`;
      remText.innerText = `Yeni barınak çuvalına son: ${left.toLocaleString()} mama 🐾`;
    }

    render();

    feedBtn.addEventListener('click', (e) => {
      score++;
      localStorage.setItem('kibbleTotalScore', score);
      render();

      mascot.classList.add('active');
      setTimeout(() => mascot.classList.remove('active'), 140);

      dropKibble(e.clientX, e.clientY);
    });

    function dropKibble(x, y) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const icons = ['🟤', '🦴', '🥩', '✨'];
      p.innerText = icons[Math.floor(Math.random() * icons.length)];
      const randX = (Math.random() - 0.5) * 60;
      p.style.left = `${x + randX}px`;
      p.style.top = `${y - 100}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }
  </script>
</body>
</html>
